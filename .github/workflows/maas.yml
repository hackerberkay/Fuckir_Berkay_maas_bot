name: Maas Takip

on:
  schedule:
    - cron: "*/5 * * * *"    # her 5 dakikada bir (GitHub'ın izin verdiği en kısa süre)
  workflow_dispatch:          # elle çalıştırma butonu

permissions:
  contents: write

concurrency:
  group: maas-takip
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install requests cryptography

      - name: Kuru kontrol et
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAAS_RUB: ${{ secrets.MAAS_RUB }}
          DAVET_KODU: ${{ secrets.DAVET_KODU }}
        run: python maas_kontrol.py

      - name: Durumu kaydet
        run: |
          git config user.name "maas-bot"
          git config user.email "maas-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "durum guncellendi" && git push)
