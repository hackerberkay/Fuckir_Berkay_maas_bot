name: Maas Takip

on:
  schedule:
    - cron: "*/10 * * * *"   # her 10 dakikada bir
  workflow_dispatch:          # elle çalıştırma butonu

permissions:
  contents: write

concurrency:
  group: maas-takip
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install requests

      - name: Kuru kontrol et
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MAAS_RUB: ${{ secrets.MAAS_RUB }}
        run: python maas_kontrol.py

      - name: Durumu kaydet
        run: |
          if [ -f durum.json ]; then
            git config user.name "maas-bot"
            git config user.email "maas-bot@users.noreply.github.com"
            git add durum.json
            git diff --cached --quiet || (git commit -m "durum guncellendi" && git push)
          fi
